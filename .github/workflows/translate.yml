name: Traduire une vidéo
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  nettoyage:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - run: |
          gh release delete test-decoupe -R "$GITHUB_REPOSITORY" -y --cleanup-tag || true
          git ls-remote "https://github.com/$GITHUB_REPOSITORY" | grep -q "refs/tags/test-decoupe" && gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/test-decoupe" || true
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" -q '.[].tag_name'
