name: Traduire une vidéo

# Lancement manuel uniquement (onglet Actions → Run workflow)
on:
  workflow_dispatch:
    inputs:
      langues:
        description: "1) Langue de SORTIE voulue : fr, it, ar ou en. Plusieurs = fr,en"
        required: true
        default: "fr"
      voix:
        description: "2) Voix off : auto = homme pour un homme, femme pour une femme (détecté seul) ; ou imposer homme / femme"
        type: choice
        options: [auto, homme, femme]
        default: auto
      sous_titres:
        description: "3) Sous-titres : bandeau karaoké EN HAUT (la vidéo est un peu réduite dessous, rien n'est caché) ou aucun"
        type: choice
        options:
          - "bandeau karaoké en haut"
          - "aucun"
        default: "bandeau karaoké en haut"
      nombre_videos:
        description: "0) Combien de vidéos de la release traduire EN MÊME TEMPS : 1, 2, 3… ou toutes"
        required: true
        default: "1"
      tag:
        description: "4) Tag de la release où est la vidéo. Vide = la release la plus récente"
        required: false
        default: ""
      fichier:
        description: "5) Laisser VIDE. (Sert seulement à traduire UNE vidéo précise par son nom exact ; le champ 0 est alors ignoré)"
        required: false
        default: ""
      langue_source:
        description: "6) Langue PARLÉE dans la vidéo. auto = détection automatique (laisser auto)"
        required: false
        default: "auto"
      volume_original:
        description: "7) Voix d'origine (musique toujours supprimée) : 0 = coupée, 0.05 = à peine audible, 0.2 = audible"
        required: false
        default: "0.05"
      modele_whisper:
        description: "8) Qualité de compréhension : medium = conseillé, small = rapide, large-v3 = meilleur mais lent"
        type: choice
        options: [medium, small, large-v3]
        default: medium

permissions:
  contents: write
  actions: read

# Pas de file d'attente globale : deux lancements ne s'annulent jamais l'un l'autre.

env:
  TV_CHUNK_SECONDS: "200"   # TEST UNIQUEMENT
  HF_HUB_DISABLE_TELEMETRY: "1"
  HF_HUB_DOWNLOAD_TIMEOUT: "60"
  HF_HUB_ETAG_TIMEOUT: "20"
  PYTHONUNBUFFERED: "1"

jobs:
  test_setup:   # TEST UNIQUEMENT : fabrique la release de test (brouillon)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - run: |
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
          gh release delete test-decoupe -R "$GITHUB_REPOSITORY" -y --cleanup-tag || true
          gh release download To_translate -R "$GITHUB_REPOSITORY" --pattern "Jeffrey*.mp4" --dir v
          F=$(ls v/*.mp4 | head -1)
          ffmpeg -v error -ss 60 -t 120 -i "$F" -c copy "v/court test.mp4"
          gh release create test-decoupe -R "$GITHUB_REPOSITORY" --draft --target test-decoupe \
            --title "TEST découpage (à supprimer)" --notes "test" "v/court test.mp4" "$F"
          gh release view test-decoupe -R "$GITHUB_REPOSITORY" --json assets -q '.assets[].name'

  lister:
    needs: test_setup
    name: "Vérifier les champs et lister les vidéos"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      IN_TAG: ${{ inputs.tag }}
      IN_FILE: ${{ inputs.fichier }}
      IN_N: ${{ inputs.nombre_videos }}
      IN_LANGS: ${{ inputs.langues }}
      IN_VOL: ${{ inputs.volume_original }}
      IN_SRC: ${{ inputs.langue_source }}
    outputs:
      tag: ${{ steps.l.outputs.tag }}
      videos: ${{ steps.l.outputs.videos }}
    steps:
      - name: Vérifier les champs du formulaire
        run: |
          set -euo pipefail
          err=0
          LANGS=$(echo "$IN_LANGS" | tr 'A-Z' 'a-z' | tr ';' ',' | tr -d ' ')
          [ -n "$LANGS" ] || { echo "::error::Champ 1 vide : mets fr, it, ar ou en."; err=1; }
          for l in ${LANGS//,/ }; do
            case "$l" in fr|it|ar|en) ;; *) echo "::error::Champ 1 : « $l » n'est pas géré. Choix : fr, it, ar, en."; err=1 ;; esac
          done
          N=$(echo "$IN_N" | tr -d ' ' | tr 'A-Z' 'a-z')
          case "$N" in toutes|tout|all|""|[0-9]|[0-9][0-9]) ;; *) echo "::error::Champ 0 : mets un nombre (1, 2, 3…) ou « toutes »."; err=1 ;; esac
          python3 -c "import sys; v=float(sys.argv[1].replace(',','.')); assert 0<=v<=1" "$IN_VOL" 2>/dev/null \
            || { echo "::error::Champ 7 : le volume doit être un nombre entre 0 et 1 (ex. 0.05)."; err=1; }
          echo "$IN_SRC" | grep -qiE '^\s*(auto|[a-z]{2,3})\s*$' \
            || { echo "::error::Champ 6 : mets « auto » ou un code de langue (ar, it, de, zh, ja…)."; err=1; }
          exit $err

      - name: Lister les vidéos de la release
        id: l
        run: |
          set -euo pipefail
          R="$GITHUB_REPOSITORY"
          gh api "repos/$R/releases?per_page=100" > releases.json
          if [ -n "$IN_TAG" ]; then
            jq -e --arg t "$IN_TAG" '[.[] | select(.tag_name==$t)][0]' releases.json > rel.json \
              || { echo "::error::Aucune release avec le tag « $IN_TAG ». Vérifie le champ 4 (ou laisse-le vide)."; exit 1; }
          else
            jq -e '[.[] | select(.draft|not)][0]' releases.json > rel.json \
              || { echo "::error::Aucune release publiée. Crée une release et dépose ta vidéo dedans."; exit 1; }
          fi
          TAG=$(jq -r .tag_name rel.json)
          # vidéos d'origine uniquement (les résultats __FR/__IT/__AR/__EN sont ignorés), dans l'ordre de dépôt
          jq -c '[.assets | sort_by(.created_at)[]
                  | select(.name | test("\\.(mp4|mov|mkv|webm|m4v|avi)$"; "i"))
                  | select(.name | test("__(FR|IT|AR|EN)\\.mp4$") | not)
                  | {id, name, size, state}]' rel.json > all.json
          if [ -n "$IN_FILE" ]; then
            jq -c --arg f "$IN_FILE" '[.[] | select(.name==$f)]' all.json > list.json
            [ "$(jq length list.json)" -gt 0 ] || { echo "::error::Champ 5 : aucune vidéo nommée « $IN_FILE » dans la release $TAG. Laisse ce champ vide."; exit 1; }
          else
            cp all.json list.json
          fi
          BROKEN=$(jq -r '.[] | select(.state!="uploaded" or .size==0) | .name' list.json)
          [ -z "$BROKEN" ] || echo "::warning::Vidéo(s) mal envoyée(s), ignorée(s) : $BROKEN"
          jq -c '[.[] | select(.state=="uploaded" and .size>0)]' list.json > ok.json
          TOTAL=$(jq length ok.json)
          if [ "$TOTAL" -eq 0 ]; then
            if [ -n "$BROKEN" ]; then
              echo "::error::La vidéo n'est pas encore entièrement envoyée dans la release « $TAG » ($BROKEN). Attends la fin de l'envoi puis relance."
            else
              echo "::error::Aucune vidéo dans la release « $TAG ». Si tu viens de l'envoyer, attends la fin de l'envoi (la vidéo doit apparaître dans la liste des fichiers de la release) puis relance."
            fi
            exit 1
          fi
          N=$(echo "$IN_N" | tr -d ' ' | tr 'A-Z' 'a-z')
          case "$N" in toutes|tout|all|"") N=$TOTAL ;; esac
          [ "$N" -ge 1 ] || N=1
          [ "$N" -le 20 ] || { echo "::warning::Maximum 20 vidéos par lancement."; N=20; }
          [ "$N" -le "$TOTAL" ] || echo "::notice::Tu as demandé $N vidéo(s), la release n'en contient que $TOTAL : toutes seront traduites."
          jq -c --argjson n "$N" '.[:$n] | map({id, name, size})' ok.json > sel.json
          {
            echo "## Lancement"
            echo "- Release : **$TAG**"
            echo "- Langue(s) de sortie : **$IN_LANGS** — langue parlée : **$IN_SRC**"
            echo "- Vidéos traduites en parallèle : **$(jq length sel.json)** sur $TOTAL"
            echo ""
            jq -r '.[] | "  - \(.name) (\(.size/1048576|floor) Mo)"' sel.json
          } >> "$GITHUB_STEP_SUMMARY"
          cat sel.json
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "videos=$(cat sel.json)" >> "$GITHUB_OUTPUT"

  preparer:
    needs: lister
    name: "Préparer : ${{ matrix.name }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        include: ${{ fromJSON(needs.lister.outputs.videos) }}
    env:
      GH_TOKEN: ${{ github.token }}
      # au-delà de cette durée, la vidéo est découpée en parties traitées en parallèle
      DECOUPE_AU_DELA_S: "300"
    steps:
      - uses: actions/checkout@v6

      - name: ffmpeg
        timeout-minutes: 15
        run: bash scripts/apt_install.sh

      - name: Télécharger la vidéo
        timeout-minutes: 30
        run: bash scripts/download_asset.sh "${{ matrix.id }}" "${{ matrix.size }}" "${{ matrix.name }}"

      - name: Durée de la vidéo
        id: d
        env:
          NAME: ${{ matrix.name }}
        run: |
          D=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "in/$NAME" 2>/dev/null | head -1)
          case "$D" in ''|N/A) D=0 ;; esac
          echo "Durée : $D s"
          if python3 -c "import sys; sys.exit(0 if float(sys.argv[1]) > float(sys.argv[2]) else 1)" "$D" "$DECOUPE_AU_DELA_S"; then
            echo "mode=parties" >> "$GITHUB_OUTPUT"
            echo "Vidéo longue : découpage en parties"
          else
            echo "mode=direct" >> "$GITHUB_OUTPUT"
          fi
          echo "duree=$D" >> "$GITHUB_OUTPUT"

      - name: Installer les outils (vidéo longue)
        if: steps.d.outputs.mode == 'parties'
        uses: ./.github/actions/installer
        with:
          modele_whisper: ${{ inputs.modele_whisper }}

      - name: Plan (points de coupe, langue et voix communes)
        timeout-minutes: 60
        env:
          NAME: ${{ matrix.name }}
          ID: ${{ matrix.id }}
          SIZE: ${{ matrix.size }}
          MODE: ${{ steps.d.outputs.mode }}
          DUR: ${{ steps.d.outputs.duree }}
          IN_SRC: ${{ inputs.langue_source }}
          IN_VOICE: ${{ inputs.voix }}
          IN_WHISPER: ${{ inputs.modele_whisper }}
        run: |
          mkdir -p plan
          if [ "$MODE" = "direct" ]; then
            jq -n --arg id "$ID" --arg n "$NAME" --arg s "$SIZE" --arg d "$DUR" \
              '{id:($id|tonumber), name:$n, size:($s|tonumber), mode:"direct", duree:($d|tonumber)}' > "plan/plan-$ID.json"
          else
            python scripts/translate_video.py --input "in/$NAME" --plan raw.json \
              --src "$IN_SRC" --voice "$IN_VOICE" --whisper "$IN_WHISPER" --outdir plan_out
            jq --arg id "$ID" --arg n "$NAME" --arg s "$SIZE" \
              '. + {id:($id|tonumber), name:$n, size:($s|tonumber), mode:"parties"}' raw.json > "plan/plan-$ID.json"
          fi
          cat "plan/plan-$ID.json"

      - uses: actions/upload-artifact@v6
        with:
          name: plan-${{ matrix.id }}
          path: plan/
          retention-days: 3
          if-no-files-found: error
          overwrite: true

  planifier:
    needs: [lister, preparer]
    if: always() && needs.lister.result == 'success'
    name: "Répartir le travail"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      taches: ${{ steps.t.outputs.taches }}
      longues: ${{ steps.t.outputs.longues }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          pattern: plan-*
          path: plans
        continue-on-error: true
      - name: Liste des tâches
        id: t
        env:
          VIDEOS: ${{ needs.lister.outputs.videos }}
          IN_SRC: ${{ inputs.langue_source }}
          IN_VOICE: ${{ inputs.voix }}
        run: |
          mkdir -p plans
          python3 scripts/build_tasks.py plans "$IN_SRC" "$IN_VOICE" "$VIDEOS"

  traduire:
    needs: [lister, planifier]
    if: always() && needs.planifier.result == 'success'
    name: "Traduire : ${{ matrix.name }}${{ matrix.n > 1 && format(' — partie {0}/{1}', matrix.k, matrix.n) || '' }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        include: ${{ fromJSON(needs.planifier.outputs.taches) }}
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.lister.outputs.tag }}
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/installer
        with:
          modele_whisper: ${{ inputs.modele_whisper }}

      - name: Télécharger la vidéo
        timeout-minutes: 30
        run: bash scripts/download_asset.sh "${{ matrix.id }}" "${{ matrix.size }}" "${{ matrix.name }}"

      - name: Traduire (transcription → traduction → voix off → montage)
        timeout-minutes: 330
        env:
          NAME: ${{ matrix.name }}
          K: ${{ matrix.k }}
          N: ${{ matrix.n }}
          START: ${{ matrix.start }}
          END: ${{ matrix['end'] }}
          TOTAL: ${{ matrix.total }}
          T_SRC: ${{ matrix.src }}
          T_VOICE: ${{ matrix.voix }}
          IN_LANGS: ${{ inputs.langues }}
          IN_SUBS: ${{ inputs.sous_titres }}
          IN_VOL: ${{ inputs.volume_original }}
          IN_WHISPER: ${{ inputs.modele_whisper }}
        run: |
          case "$IN_SUBS" in
            aucun*) SUBS=non ;;
            *)      SUBS=bandeau ;;
          esac
          ARGS=(--input "in/$NAME" --langs "$IN_LANGS" --voice "$T_VOICE" --subs "$SUBS" --src "$T_SRC"
                --orig-vol "${IN_VOL//,/.}" --whisper "$IN_WHISPER" --outdir out)
          if [ "$N" -gt 1 ]; then
            ARGS+=(--start "$START" --end "$END" --part "$K/$N" --total-dur "$TOTAL")
          fi
          for essai in 1 2; do
            rm -rf out work
            python scripts/translate_video.py "${ARGS[@]}" && { ls -la out; exit 0; }
            code=$?
            # 2 = erreur définitive (fichier invalide…) : réessayer ne servirait à rien
            if [ "$code" = 2 ] || [ "$essai" = 2 ]; then exit "$code"; fi
            echo "::warning::Erreur imprévue (code $code) : nouvel essai complet dans 30 s."
            sleep 30
          done

      - name: Publier dans la même release
        if: matrix.n == 1
        timeout-minutes: 20
        run: bash scripts/publish.sh "$TAG" out

      - name: Copie de secours + rapport (artefact 7 jours)
        if: always() && matrix.n == 1
        uses: actions/upload-artifact@v6
        with:
          name: resultat-${{ matrix.id }}
          path: out/
          retention-days: 7
          if-no-files-found: ignore
          overwrite: true

      - name: Transmettre la partie au recollage
        if: matrix.n > 1
        uses: actions/upload-artifact@v6
        with:
          name: part-${{ matrix.id }}-${{ matrix.k }}
          path: out/
          retention-days: 3
          if-no-files-found: error
          overwrite: true
          compression-level: 0

  recoller:
    needs: [lister, planifier, traduire]
    if: always() && needs.planifier.result == 'success' && needs.planifier.outputs.longues != '[]'
    name: "Recoller : ${{ matrix.name }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.planifier.outputs.longues) }}
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.lister.outputs.tag }}
    steps:
      - uses: actions/checkout@v6

      - name: ffmpeg
        timeout-minutes: 15
        run: bash scripts/apt_install.sh

      - uses: actions/download-artifact@v7
        with:
          name: plan-${{ matrix.id }}
          path: plan

      - name: Récupérer les parties
        uses: actions/download-artifact@v7
        with:
          pattern: part-${{ matrix.id }}-*
          path: dl
        continue-on-error: true

      - name: Recoller (vidéo, sous-titres, transcription)
        timeout-minutes: 60
        env:
          ID: ${{ matrix.id }}
        run: |
          mkdir -p parts dl
          for d in dl/part-"$ID"-*; do
            [ -d "$d" ] || continue
            k="${d##*-}"
            mv "$d" "parts/part-$k"
          done
          ls -R parts | head -50
          python3 scripts/assemble.py --plan "plan/plan-$ID.json" --parts parts --outdir out

      - name: Publier dans la même release
        timeout-minutes: 30
        run: bash scripts/publish.sh "$TAG" out

      - name: Copie de secours + rapport (artefact 7 jours)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: resultat-${{ matrix.id }}
          path: out/
          retention-days: 7
          if-no-files-found: ignore
          overwrite: true

  bilan:
    name: "Bilan"
    needs: [lister, preparer, planifier, traduire, recoller]
    if: always() && needs.lister.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.lister.outputs.tag }}
    steps:
      - name: Bilan du lancement
        run: |
          R="$GITHUB_REPOSITORY"
          gh api "repos/$R/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" --paginate \
            -q '.jobs[] | select(.name != "Bilan") | [.name, (.conclusion // .status)] | @tsv' > jobs.tsv || true
          # jobs non lancés car rien à faire (ex. pas de vidéo longue) : ignorés
          grep -v $'\tskipped$' jobs.tsv > used.tsv || true
          BAD=$(grep -cvE $'\tsuccess$' used.tsv || true)
          {
            echo "## Bilan : $([ "$BAD" = 0 ] && echo '✅ tout est réussi' || echo "❌ $BAD étape(s) en échec")"
            echo ""
            echo "| Étape | Résultat |"
            echo "|---|---|"
            while IFS=$'\t' read -r n c; do
              case "$c" in success) e="✅";; failure) e="❌ échec (voir le détail du job)";; cancelled) e="⏹ annulé";; *) e="$c";; esac
              echo "| $n | $e |"
            done < used.tsv
            echo ""
            echo "Les vidéos longues ne sont publiées qu'une fois toutes leurs parties réussies et recollées."
            echo ""
            echo "Fichiers maintenant dans la release **$TAG** :"
            gh api "repos/$R/releases?per_page=100" | jq -r --arg t "$TAG" \
              '.[] | select(.tag_name==$t) | .assets[] | "- \(.name) (\(.size/1048576*10|floor/10) Mo)"'
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"
          [ "$BAD" = 0 ] || { echo "::error::$BAD étape(s) en échec — voir le tableau du bilan."; exit 1; }
