name: Traduire une vidéo

# Lancement manuel uniquement (onglet Actions → Run workflow)
on:
  workflow_dispatch:
    inputs:
      langues:
        description: "1) Langue de SORTIE voulue : fr, it, ar ou en. Plusieurs = fr,en"
        required: true
        default: "fr"
      voix:
        description: "2) Voix off : homme ou femme (en arabe, toujours homme)"
        type: choice
        options: [homme, femme]
        default: homme
      sous_titres:
        description: "3) Sous-titres : où les afficher"
        type: choice
        options:
          - "sous l'image (bande noire, visages jamais cachés)"
          - "sur l'image (en bas, peut cacher le menton)"
          - "aucun"
        default: "sous l'image (bande noire, visages jamais cachés)"
      nombre_videos:
        description: "0) Combien de vidéos de la release traduire EN MÊME TEMPS : 1, 2, 3… ou toutes"
        required: true
        default: "1"
      tag:
        description: "4) Tag de la release où est la vidéo. Vide = la release la plus récente"
        required: false
        default: ""
      fichier:
        description: "5) Nom d'UNE vidéo précise (ignore le champ 0). Vide = les vidéos de la release dans l'ordre"
        required: false
        default: ""
      langue_source:
        description: "6) Langue PARLÉE dans la vidéo. auto = détection automatique (laisser auto)"
        required: false
        default: "auto"
      volume_original:
        description: "7) Volume de la voix d'origine : 0 = muette, 0.05 = à peine audible, 0.2 = audible"
        required: false
        default: "0.05"
      modele_whisper:
        description: "8) Qualité de compréhension : medium = conseillé, small = rapide, large-v3 = meilleur mais lent"
        type: choice
        options: [medium, small, large-v3]
        default: medium

permissions:
  contents: write

concurrency:
  group: translate-video
  cancel-in-progress: false

jobs:
  lister:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      IN_TAG: ${{ inputs.tag }}
      IN_FILE: ${{ inputs.fichier }}
      IN_N: ${{ inputs.nombre_videos }}
    outputs:
      tag: ${{ steps.l.outputs.tag }}
      videos: ${{ steps.l.outputs.videos }}
    steps:
      - name: Lister les vidéos à traduire
        id: l
        run: |
          set -euo pipefail
          TAG="$IN_TAG"
          if [ -z "$TAG" ]; then
            TAG=$(gh release list -R "$GITHUB_REPOSITORY" --exclude-drafts --limit 1 --json tagName -q '.[0].tagName')
          fi
          [ -n "$TAG" ] || { echo "::error::Aucune release trouvée. Crée une release avec ta vidéo."; exit 1; }
          if [ -n "$IN_FILE" ]; then
            printf '%s\n' "$IN_FILE" > list.txt
          else
            gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' \
              | grep -iE '\.(mp4|mov|mkv|webm|m4v|avi)$' \
              | grep -vE '__(FR|IT|AR|EN)\.mp4$' > list.txt || true
          fi
          [ -s list.txt ] || { echo "::error::Aucune vidéo à traduire dans la release $TAG"; exit 1; }
          N=$(echo "$IN_N" | tr -d ' ' | tr 'A-Z' 'a-z')
          case "$N" in
            toutes|tout|all|"") N=$(wc -l < list.txt) ;;
            *[!0-9]*) echo "::error::Champ 0 : mets un nombre (1, 2, 3…) ou « toutes »"; exit 1 ;;
          esac
          [ "$N" -ge 1 ] || N=1
          [ "$N" -le 20 ] || N=20
          head -n "$N" list.txt > sel.txt
          echo "Release : $TAG"; echo "Vidéos traduites en parallèle :"; cat sel.txt
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "videos=$(jq -R -s -c 'split("\n") | map(select(length>0))' sel.txt)" >> "$GITHUB_OUTPUT"

  traduire:
    needs: lister
    name: "Traduire : ${{ matrix.video }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        video: ${{ fromJSON(needs.lister.outputs.videos) }}
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.lister.outputs.tag }}
      NAME: ${{ matrix.video }}
      HF_HUB_DISABLE_TELEMETRY: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Paquets système (ffmpeg, polices dont l'arabe)
        run: |
          for i in 1 2 3; do
            sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends ffmpeg fonts-noto-core && break
            sleep 15
          done
          ffmpeg -version | head -1

      - name: Cache des modèles
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            models
          key: models-v1-${{ inputs.modele_whisper }}
          restore-keys: models-v1-

      - name: Dépendances Python
        run: |
          pip install --retries 5 --index-url https://download.pytorch.org/whl/cpu torch==2.4.1
          pip install --retries 5 -r requirements.txt

      - name: Moteur de voix Piper
        run: |
          if [ ! -x models/piper/piper/piper ]; then
            mkdir -p models/piper
            curl -fL --retry 5 --retry-delay 10 -o /tmp/piper.tgz \
              https://github.com/rhasspy/piper/releases/download/2023.11.14-2/piper_linux_x86_64.tar.gz
            tar -xzf /tmp/piper.tgz -C models/piper
          fi
          test -x models/piper/piper/piper

      - name: Récupérer la vidéo de la release
        id: get
        run: |
          set -euo pipefail
          mkdir -p in
          ok=0
          for i in 1 2 3 4; do
            gh release download "$TAG" -R "$GITHUB_REPOSITORY" --pattern "$NAME" --dir in --clobber && ok=1 && break
            sleep $((10 * i))
          done
          [ "$ok" = 1 ] && test -s "in/$NAME" || { echo "::error::Impossible de télécharger « $NAME » depuis la release $TAG"; exit 1; }
          echo "Release : $TAG — vidéo : $NAME"
          echo "file=in/$NAME" >> "$GITHUB_OUTPUT"

      - name: Traduire (transcription → traduction → voix off → montage)
        env:
          IN_VIDEO: ${{ steps.get.outputs.file }}
          IN_LANGS: ${{ inputs.langues }}
          IN_VOICE: ${{ inputs.voix }}
          IN_SUBS: ${{ inputs.sous_titres }}
          IN_SRC: ${{ inputs.langue_source }}
          IN_VOL: ${{ inputs.volume_original }}
          IN_WHISPER: ${{ inputs.modele_whisper }}
        run: |
          case "$IN_SUBS" in
            sous*) SUBS=bande ;;
            sur*)  SUBS=bas ;;
            *)     SUBS=non ;;
          esac
          python scripts/translate_video.py --input "$IN_VIDEO" --langs "$IN_LANGS" \
            --voice "$IN_VOICE" --subs "$SUBS" --src "$IN_SRC" \
            --orig-vol "$IN_VOL" --whisper "$IN_WHISPER" --outdir out
          ls -la out

      - name: Publier dans la même release
        run: |
          for i in 1 2 3 4; do gh release upload "$TAG" out/* -R "$GITHUB_REPOSITORY" --clobber && exit 0; sleep $((15 * i)); done
          echo "::warning::Envoi dans la release raté — récupère la vidéo dans les artefacts du run."

      - name: Copie de secours (artefact 7 jours)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-traduite-${{ strategy.job-index }}
          path: out/
          retention-days: 7
          if-no-files-found: ignore
